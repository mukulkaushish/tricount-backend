# Docker Compose file for Vapor
#
# Install Docker on your system to run and test
# your Vapor app in a production-like environment.
#
# Note: This file is intended for testing and does not
# implement best practices for a production deployment.
#
# Learn more: https://docs.docker.com/compose/reference/
#
#   Build images: docker compose build
#      Start app: docker compose up app
#       Stop all: docker compose down
#

x-shared_environment: &shared_environment
  LOG_LEVEL: ${LOG_LEVEL:-debug}
  JWT_SECRET: ${JWT_SECRET:-change-me-in-docker-compose}
  MYSQL_HOST: ${MYSQL_HOST:-mysql}
  MYSQL_PORT: ${MYSQL_PORT:-3306}
  MYSQL_USERNAME: ${MYSQL_USERNAME:-tricount}
  MYSQL_PASSWORD: ${MYSQL_PASSWORD:-tricount}
  MYSQL_DATABASE: ${MYSQL_DATABASE:-tricount}
  
services:
  app:
    image: tricount-backend:latest
    build:
      context: .
    environment:
      <<: *shared_environment
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - '8080:8080'
    # user: '0' # uncomment to run as root for testing purposes even though Dockerfile defines 'vapor' user.
    command: ["serve", "--env", "production", "--hostname", "0.0.0.0", "--port", "8080"]
  migrate:
    image: tricount-backend:latest
    build:
      context: .
    environment:
      <<: *shared_environment
    depends_on:
      mysql:
        condition: service_healthy
    command: ["migrate", "--yes"]
    deploy:
      replicas: 0
  revert:
    image: tricount-backend:latest
    build:
      context: .
    environment:
      <<: *shared_environment
    depends_on:
      mysql:
        condition: service_healthy
    command: ["migrate", "--revert", "--yes"]
    deploy:
      replicas: 0
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-tricount}
      MYSQL_USER: ${MYSQL_USERNAME:-tricount}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-tricount}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
